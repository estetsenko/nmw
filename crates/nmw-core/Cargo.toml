[package]
name = "nmw-core"
version = "0.1.0"
description = "NMW mesh protocol core: packet codec, crypto, routing and transport (no_std + alloc)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chacha20 = { version = "0.9", default-features = false }
poly1305 = { version = "0.8", default-features = false }
ed25519-dalek = { version = "2", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
sha2 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
subtle = { version = "2", default-features = false }
