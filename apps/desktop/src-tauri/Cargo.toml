[package]
name = "nmw-desktop"
version = "0.1.0"
description = "NMW desktop app: chat, contacts and radio log over a simulated mesh (a real radio over USB later)"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nmw-host = { path = "../../../crates/nmw-host" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"
