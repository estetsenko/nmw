name: CI

# Packages for Linux, macOS and Windows are built only after `check` and
# `desktop` pass, and uploaded as workflow artifacts. A pushed `v*` tag also
# attaches them to a draft GitHub release. Packages are not code-signed yet.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The desktop app has its own job (it needs WebKitGTK); the default
      # workspace members are the protocol crates.
      - run: cargo test
      - name: nmw-core builds without std
        run: cargo build -p nmw-core --target thumbv7em-none-eabihf
      - name: Simulator gate, contacts shared by QR (M0 exit criterion)
        run: cargo run --release -p nmw-sim -- --seeds 20 --shared-contacts --loss 0.2 --min-delivery 0.95
      - name: Simulator gate, contacts from announces and contact requests
        run: cargo run --release -p nmw-sim -- --seeds 20 --loss 0.2 --min-delivery 0.95
      - name: Simulator gate, group channel
        run: cargo run --release -p nmw-sim -- --seeds 20 --group --loss 0.2 --min-delivery 0.93

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install WebKitGTK and friends
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - run: cargo clippy -p nmw-desktop -- -D warnings
      - run: cargo build -p nmw-desktop
      - run: cargo test -p nmw-desktop
      - name: UI script parses
        run: node --check apps/desktop/ui/app.js

  package:
    name: package (${{ matrix.name }})
    needs: [check, desktop]
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement low so the packages run on older distros.
          - name: linux
            os: ubuntu-22.04
            args: ''
            bundle: target/release/bundle
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle
          - name: windows
            os: windows-latest
            args: ''
            bundle: target/release/bundle
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: packages
      - name: Install WebKitGTK and friends
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: Build packages
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: nmw-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe

  # Every push to main replaces the "Latest build" pre-release with the
  # packages from this run, so the newest installers are one click away
  # without signing in. Tagged versions keep their own draft releases.
  publish-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nmw-desktop-*
          path: dist
      - name: Replace the Latest build release
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Desktop packages built from main at ${GITHUB_SHA::7}. Not code-signed: on macOS use System Settings > Privacy & Security > Open Anyway on first launch." \
            $(find dist -type f)
